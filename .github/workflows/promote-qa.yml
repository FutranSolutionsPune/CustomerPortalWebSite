name: Customer Portal Website - QA Deployment

on:
  workflow_run:
    workflows:
      - Customer Portal Website CI
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:

  deploy-qa:
    name: Deploy to QA IIS

    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'release/') }}

    runs-on: [self-hosted, windows, iis, dev]

    environment:
      name: QA

    steps:

      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: CustomerPortalWebSite
          path: ./package
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Deploy to IIS
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPool = "DefaultAppPool"
          $target = "C:\inetpub\wwwroot\MyProject-QA"

          Write-Host "Stopping IIS App Pool: $appPool"
          Stop-WebAppPool -Name $appPool

          Start-Sleep -Seconds 5

          Write-Host "Removing existing application files..."

          if (Test-Path $target) {
              Remove-Item "$target\*" -Recurse -Force
          }

          Write-Host "Copying new application files..."

          Copy-Item ".\package\*" $target -Recurse -Force

          Write-Host "Starting IIS App Pool: $appPool"
          Start-WebAppPool -Name $appPool

          Write-Host "QA deployment completed."

      - name: Verify deployment
        shell: powershell
        run: |
          Write-Host "QA deployment completed."

          Get-ChildItem "C:\inetpub\wwwroot\MyProject-QA"

  qa-approval:
    name: QA Approval

    needs: deploy-qa

    runs-on: ubuntu-latest

    # Only the latest release should wait for QA approval.
    # A newer release cancels an older pending approval.
    concurrency:
      group: qa-release-approval
      cancel-in-progress: true

    environment:
      name: QA-VALIDATION

    steps:

      - name: QA validation approved
        run: |
          echo "QA validation approved."
          echo "Release is authorized to proceed to PROD."

      - name: Trigger PROD deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          echo "Triggering PROD deployment..."
          echo "Original CI Run ID: $CI_RUN_ID"
          echo "Release branch: $RELEASE_BRANCH"

          gh workflow run promote-prod.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f ci_run_id="$CI_RUN_ID" \
            -f release_branch="$RELEASE_BRANCH"

          echo "PROD workflow triggered successfully."
