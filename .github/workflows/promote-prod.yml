name: Customer Portal Website - PROD Deployment

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Original CI workflow run ID"
        required: true
        type: string

      release_branch:
        description: "Release branch being promoted"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:

  deploy-prod:

    name: Deploy to PROD IIS

    runs-on: [self-hosted, windows, iis, prod]

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    environment:
      name: PROD

    steps:

      - name: Display release information
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "GTL PROD DEPLOYMENT"
          Write-Host "======================================"
          Write-Host "CI Run ID: ${{ inputs.ci_run_id }}"
          Write-Host "Release Branch: ${{ inputs.release_branch }}"
          Write-Host "======================================"

      - name: Download exact CI artifact
        uses: actions/download-artifact@v4
        with:
          name: CustomerPortalWebSite
          path: ./package
          run-id: ${{ inputs.ci_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify artifact
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "PROD ARTIFACT"
          Write-Host "======================================"

          if (-not (Test-Path ".\package")) {
              throw "Artifact was not downloaded."
          }

          $files = Get-ChildItem ".\package" -Recurse

          if ($files.Count -eq 0) {
              throw "Artifact package is empty."
          }

          $files |
            Select-Object FullName, Length

          Write-Host "Artifact verification successful."

      - name: Deploy to PROD IIS
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPool = "MyProject-PROD"
          $target  = "C:\inetpub\wwwroot\MyProject-PROD"

          Write-Host "Stopping IIS App Pool: $appPool"

          Stop-WebAppPool -Name $appPool

          Start-Sleep -Seconds 5

          Write-Host "Removing existing application files..."

          if (Test-Path $target) {
              Remove-Item "$target\*" -Recurse -Force
          }

          Write-Host "Copying application files..."

          Copy-Item ".\package\*" $target -Recurse -Force

          Write-Host "Starting IIS App Pool: $appPool"

          Start-WebAppPool -Name $appPool

          Start-Sleep -Seconds 5

          Write-Host "Starting IIS Website..."

          Start-Website -Name "MyProject-PROD"

          Write-Host "PROD deployment completed."

      - name: Verify PROD
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "PROD VERIFICATION"
          Write-Host "======================================"

          Get-Website -Name "MyProject-PROD" |
            Select-Object Name, State, PhysicalPath, ApplicationPool

          Write-Host ""
          Write-Host "Deployed files:"

          Get-ChildItem "C:\inetpub\wwwroot\MyProject-PROD" |
            Select-Object Name, Length

          Write-Host ""
          Write-Host "PROD deployment successful."
