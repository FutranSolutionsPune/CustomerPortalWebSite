name: Customer Portal Website - PROD Deployment

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: 'Successful CI workflow run ID containing the release artifact'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:

  deploy-prod:

    name: Deploy to PROD IIS

    runs-on: [self-hosted, windows, iis, prod]

    environment:
      name: PROD

    steps:

      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: CustomerPortalWebSite
          path: ./package
          run-id: ${{ inputs.ci_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifact
        shell: powershell
        run: |
          Write-Host "=== PROD ARTIFACT ==="

          if (-not (Test-Path ".\package")) {
              throw "Artifact was not downloaded."
          }

          Get-ChildItem ".\package" -Recurse |
            Select-Object FullName, Length

      - name: Deploy to PROD IIS
        shell: powershell
        run: |

          Import-Module WebAdministration

          $appPool = "MyProject-PROD"
          $target  = "C:\inetpub\wwwroot\MyProject-PROD"

          Write-Host "Stopping IIS App Pool..."

          Stop-WebAppPool -Name $appPool

          Start-Sleep -Seconds 3

          Write-Host "Removing existing application files..."

          if (Test-Path $target) {
              Remove-Item "$target\*" -Recurse -Force
          }

          Write-Host "Copying release artifact..."

          Copy-Item ".\package\*" `
            $target `
            -Recurse `
            -Force

          Write-Host "Starting IIS App Pool..."

          Start-WebAppPool -Name $appPool

          Start-Sleep -Seconds 5

          Start-Website -Name "MyProject-PROD"

          Write-Host "PROD deployment completed."

      - name: Verify PROD
        shell: powershell
        run: |

          Write-Host "=== PROD VERIFICATION ==="

          Get-Website -Name "MyProject-PROD" |
            Select-Object Name, State, PhysicalPath, ApplicationPool

          Get-ChildItem `
            "C:\inetpub\wwwroot\MyProject-PROD" |
            Select-Object Name, Length

          Write-Host "PROD deployment successful."
