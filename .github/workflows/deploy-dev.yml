name: Customer Portal Website - DEV Deployment

on:
  workflow_run:
    workflows:
      - Customer Portal Website CI
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  deploy-dev:
    name: Deploy to DEV IIS
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, windows, iis, dev]

    environment:
      name: DEV

    steps:
      - name: Download CI artifact
        uses: actions/download-artifact@v4
        with:
          name: CustomerPortalWebSite
          path: ./package
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to IIS
        shell: powershell
        run: |
          $target = "C:\inetpub\wwwroot\MyProject-TEST"
          $offlineFile = Join-Path $target "app_offline.htm"

          if (-not (Test-Path $target)) {
              New-Item -ItemType Directory -Path $target -Force | Out-Null
          }

          Write-Host "Putting application offline..."

          Set-Content -Path $offlineFile -Value @"
          <!DOCTYPE html>
          <html>
          <head><title>Deployment in progress</title></head>
          <body><h2>Deployment in progress...</h2></body>
          </html>
          "@

          Start-Sleep -Seconds 8

          Write-Host "Copying CI artifact to DEV..."

          robocopy ".\package" $target /MIR /R:3 /W:5

          if ($LASTEXITCODE -gt 7) {
              throw "Robocopy failed with exit code $LASTEXITCODE"
          }

          Write-Host "Removing offline page..."

          Remove-Item $offlineFile -Force

          Write-Host "DEV deployment completed successfully."

      - name: Verify deployment
        shell: powershell
        run: |
          Write-Host "Deployment completed."
          Get-ChildItem "C:\inetpub\wwwroot\MyProject-TEST"
